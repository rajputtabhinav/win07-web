<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Traditional table -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="url(#tableGradient)"/>
  <ellipse cx="200" cy="150" rx="160" ry="100" fill="none" stroke="#065f46" stroke-width="3"/>
  
  <!-- Center joker card -->
  <g transform="translate(185,125)">
    <rect x="0" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="15" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">J</text>
    <text x="15" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#DC2626">♦</text>
  </g>
  
  <!-- Joker label -->
  <rect x="170" y="175" width="60" height="20" rx="10" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="188" text-anchor="middle" fill="#FBBF24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">JOKER</text>
  
  <!-- Andar side (left) -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(239,68,68,0.3)" stroke="#EF4444" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ANDAR</text>
    
    <!-- Andar cards -->
    <rect x="10" y="40" width="25" height="35" rx="4" fill="white" filter="url(#cardShadow)"/>
    <text x="17" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="black">7</text>
    <text x="17" y="67" font-family="Arial, sans-serif" font-size="12" fill="black">♣</text>
    
    <rect x="45" y="40" width="25" height="35" rx="4" fill="white" filter="url(#cardShadow)"/>
    <text x="52" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">K</text>
    <text x="52" y="67" font-family="Arial, sans-serif" font-size="12" fill="#DC2626">♥</text>
  </g>
  
  <!-- Bahar side (right) -->
  <g transform="translate(260,100)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(59,130,246,0.3)" stroke="#3B82F6" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BAHAR</text>
    
    <!-- Bahar cards -->
    <rect x="10" y="40" width="25" height="35" rx="4" fill="white" filter="url(#cardShadow)"/>
    <text x="17" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">A</text>
    <text x="17" y="67" font-family="Arial, sans-serif" font-size="12" fill="#DC2626">♦</text>
    
    <rect x="45" y="40" width="25" height="35" rx="4" fill="white" filter="url(#cardShadow)"/>
    <text x="52" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="black">9</text>
    <text x="52" y="67" font-family="Arial, sans-serif" font-size="12" fill="black">♠</text>
    
    <rect x="80" y="40" width="25" height="35" rx="4" fill="white" filter="url(#cardShadow)"/>
    <text x="87" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">J</text>
    <text x="87" y="67" font-family="Arial, sans-serif" font-size="12" fill="#DC2626">♦</text>
  </g>
  
  <!-- Winner announcement -->
  <rect x="260" y="200" width="100" height="30" rx="15" fill="rgba(59,130,246,0.8)"/>
  <text x="310" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BAHAR WINS!</text>
  
  <!-- Traditional elements -->
  <g fill="#FBBF24" opacity="0.6">
    <polygon points="50,50 55,60 65,60 57,67 60,77 50,72 40,77 43,67 35,60 45,60" transform="scale(0.8)"/>
    <polygon points="350,50 355,60 365,60 357,67 360,77 350,72 340,77 343,67 335,60 345,60" transform="scale(0.8)"/>
  </g>
  
  <!-- Betting chips -->
  <g transform="translate(90,180)">
    <circle cx="0" cy="0" r="10" fill="#EF4444"/>
    <circle cx="0" cy="0" r="6" fill="#F87171"/>
    <text x="0" y="2" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">500</text>
  </g>
  
  <g transform="translate(310,180)">
    <circle cx="0" cy="0" r="12" fill="#3B82F6"/>
    <circle cx="0" cy="0" r="8" fill="#60A5FA"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">1000</text>
  </g>
  
  <!-- Game info -->
  <rect x="50" y="240" width="120" height="20" rx="10" fill="rgba(16,185,129,0.2)"/>
  <text x="110" y="253" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TRADITIONAL INDIAN</text>
  
  <rect x="230" y="240" width="120" height="20" rx="10" fill="rgba(245,158,11,0.2)"/>
  <text x="290" y="253" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SIMPLE RULES</text>
  
  <!-- Decorative border elements -->
  <g stroke="#065f46" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 80 80 Q 90 70 100 80"/>
    <path d="M 300 80 Q 310 70 320 80"/>
    <path d="M 80 220 Q 90 230 100 220"/>
    <path d="M 300 220 Q 310 230 320 220"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ANDAR BAHAR</text>
</svg>
