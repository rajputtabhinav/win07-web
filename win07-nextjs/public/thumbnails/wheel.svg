<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="wheelGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Wheel Base -->
  <circle cx="200" cy="150" r="120" fill="#374151" stroke="#4B5563" stroke-width="4"/>
  
  <!-- Wheel Segments -->
  <g transform="translate(200,150)">
    <!-- 8 segments with different colors and multipliers -->
    <path d="M 0,-110 A 110,110 0 0,1 77.78,-77.78 L 0,0 Z" fill="#EF4444" stroke="white" stroke-width="2"/>
    <text x="30" y="-55" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">50x</text>
    
    <path d="M 77.78,-77.78 A 110,110 0 0,1 110,0 L 0,0 Z" fill="#F59E0B" stroke="white" stroke-width="2"/>
    <text x="55" y="-20" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">5x</text>
    
    <path d="M 110,0 A 110,110 0 0,1 77.78,77.78 L 0,0 Z" fill="#10B981" stroke="white" stroke-width="2"/>
    <text x="55" y="30" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2x</text>
    
    <path d="M 77.78,77.78 A 110,110 0 0,1 0,110 L 0,0 Z" fill="#3B82F6" stroke="white" stroke-width="2"/>
    <text x="30" y="65" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">10x</text>
    
    <path d="M 0,110 A 110,110 0 0,1 -77.78,77.78 L 0,0 Z" fill="#8B5CF6" stroke="white" stroke-width="2"/>
    <text x="-40" y="65" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1x</text>
    
    <path d="M -77.78,77.78 A 110,110 0 0,1 -110,0 L 0,0 Z" fill="#EC4899" stroke="white" stroke-width="2"/>
    <text x="-65" y="30" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">25x</text>
    
    <path d="M -110,0 A 110,110 0 0,1 -77.78,-77.78 L 0,0 Z" fill="#06B6D4" stroke="white" stroke-width="2"/>
    <text x="-65" y="-20" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3x</text>
    
    <path d="M -77.78,-77.78 A 110,110 0 0,1 0,-110 L 0,0 Z" fill="#84CC16" stroke="white" stroke-width="2"/>
    <text x="-40" y="-55" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">15x</text>
  </g>
  
  <!-- Center Hub -->
  <circle cx="200" cy="150" r="25" fill="#1F2937" stroke="#FBBF24" stroke-width="3"/>
  <circle cx="200" cy="150" r="15" fill="#374151"/>
  
  <!-- Pointer -->
  <g transform="translate(200,30)">
    <polygon points="0,0 -10,15 10,15" fill="#FBBF24" filter="url(#glow)"/>
    <polygon points="0,0 -6,10 6,10" fill="#FDE047"/>
  </g>
  
  <!-- Spinning effect lines -->
  <g stroke="rgba(251,191,36,0.3)" stroke-width="2" opacity="0.7">
    <line x1="80" y1="150" x2="120" y2="150"/>
    <line x1="280" y1="150" x2="320" y2="150"/>
    <line x1="200" y1="30" x2="200" y2="70"/>
    <line x1="200" y1="230" x2="200" y2="270"/>
  </g>
  
  <!-- Betting chips -->
  <g transform="translate(50,80)">
    <circle cx="0" cy="0" r="15" fill="#EF4444"/>
    <circle cx="0" cy="0" r="10" fill="#F87171"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">500</text>
  </g>
  
  <g transform="translate(350,220)">
    <circle cx="0" cy="0" r="12" fill="#10B981"/>
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">100</text>
  </g>
  
  <!-- Win indicator -->
  <rect x="280" y="20" width="100" height="30" rx="15" fill="rgba(16,185,129,0.2)"/>
  <text x="330" y="40" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">WIN 25x!</text>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold">WHEEL OF FORTUNE</text>
</svg>
