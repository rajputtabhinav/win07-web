<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Stars -->
  <g fill="white" opacity="0.8">
    <circle cx="50" cy="40" r="1"/>
    <circle cx="120" cy="30" r="1.5"/>
    <circle cx="180" cy="50" r="1"/>
    <circle cx="250" cy="35" r="1.2"/>
    <circle cx="320" cy="45" r="1"/>
    <circle cx="370" cy="60" r="1.5"/>
    <circle cx="80" cy="80" r="1"/>
    <circle cx="300" cy="90" r="1.2"/>
  </g>
  
  <!-- Vertical multiplier scale -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="white" font-family="Arial, sans-serif" font-size="12">
    <line x1="50" y1="80" x2="50" y2="250"/>
    
    <!-- Scale markers -->
    <line x1="45" y1="240" x2="55" y2="240"/>
    <text x="40" y="245" text-anchor="end" fill="white">1x</text>
    
    <line x1="45" y1="200" x2="55" y2="200"/>
    <text x="40" y="205" text-anchor="end" fill="white">10x</text>
    
    <line x1="45" y1="160" x2="55" y2="160"/>
    <text x="40" y="165" text-anchor="end" fill="white">100x</text>
    
    <line x1="45" y1="120" x2="55" y2="120"/>
    <text x="40" y="125" text-anchor="end" fill="white">1000x</text>
    
    <line x1="45" y1="80" x2="55" y2="80"/>
    <text x="40" y="85" text-anchor="end" fill="white">∞</text>
  </g>
  
  <!-- Rocket trajectory -->
  <path d="M 80 240 Q 150 180 220 140 Q 280 100 340 80" 
        fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
  
  <!-- Rocket -->
  <g transform="translate(340,80) rotate(-30)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#rocketGradient)" filter="url(#glow)"/>
    <!-- Rocket nose -->
    <polygon points="15,0 25,-3 25,3" fill="#FBBF24"/>
    <!-- Rocket fins -->
    <polygon points="-15,-5 -25,-8 -20,0 -25,8 -15,5" fill="#DC2626"/>
    <!-- Engine glow -->
    <ellipse cx="-20" cy="0" rx="8" ry="6" fill="#3B82F6" opacity="0.8"/>
    <ellipse cx="-25" cy="0" rx="5" ry="4" fill="#60A5FA" opacity="0.6"/>
  </g>
  
  <!-- Current multiplier display -->
  <rect x="250" y="60" width="120" height="40" rx="20" fill="rgba(0,0,0,0.8)"/>
  <text x="310" y="85" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="24" font-weight="bold">847.32x</text>
  
  <!-- Target multiplier -->
  <rect x="120" y="20" width="100" height="30" rx="15" fill="rgba(245,158,11,0.2)"/>
  <text x="170" y="40" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Target: 1000x</text>
  
  <!-- Danger zone indicator -->
  <rect x="280" y="200" width="100" height="25" rx="12" fill="rgba(239,68,68,0.3)"/>
  <text x="330" y="217" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DANGER ZONE!</text>
  
  <!-- Previous results -->
  <g transform="translate(80,260)">
    <rect x="0" y="0" width="50" height="20" rx="10" fill="rgba(16,185,129,0.2)"/>
    <text x="25" y="14" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">23.4x</text>
  </g>
  
  <g transform="translate(140,260)">
    <rect x="0" y="0" width="50" height="20" rx="10" fill="rgba(239,68,68,0.2)"/>
    <text x="25" y="14" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1.2x</text>
  </g>
  
  <g transform="translate(200,260)">
    <rect x="0" y="0" width="50" height="20" rx="10" fill="rgba(16,185,129,0.2)"/>
    <text x="25" y="14" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="10" font-weight="bold">156x</text>
  </g>
  
  <!-- Exhaust trail -->
  <g opacity="0.6">
    <ellipse cx="320" cy="90" rx="15" ry="5" fill="#3B82F6" opacity="0.4"/>
    <ellipse cx="310" cy="95" rx="12" ry="4" fill="#60A5FA" opacity="0.3"/>
    <ellipse cx="300" cy="100" rx="10" ry="3" fill="#93C5FD" opacity="0.2"/>
  </g>
  
  <!-- Warning text -->
  <text x="200" y="190" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="14" font-weight="bold" opacity="0.8">
    How high can you go?
  </text>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">LIMBO</text>
</svg>
