<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="wheelGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </radialGradient>
    <filter id="ballGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Roulette wheel outer ring -->
  <circle cx="200" cy="150" r="100" fill="#8B4513" stroke="#654321" stroke-width="4"/>
  
  <!-- Wheel segments (European style - 37 numbers) -->
  <g transform="translate(200,150)">
    <!-- Simplified representation with key segments -->
    <path d="M 0,-90 A 90,90 0 0,1 63.64,-63.64 L 0,0 Z" fill="#DC2626" stroke="white" stroke-width="1"/>
    <text x="25" y="-45" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">32</text>
    
    <path d="M 63.64,-63.64 A 90,90 0 0,1 90,0 L 0,0 Z" fill="#1F2937" stroke="white" stroke-width="1"/>
    <text x="45" y="-20" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">15</text>
    
    <path d="M 90,0 A 90,90 0 0,1 63.64,63.64 L 0,0 Z" fill="#DC2626" stroke="white" stroke-width="1"/>
    <text x="45" y="25" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">19</text>
    
    <path d="M 63.64,63.64 A 90,90 0 0,1 0,90 L 0,0 Z" fill="#1F2937" stroke="white" stroke-width="1"/>
    <text x="25" y="50" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">4</text>
    
    <path d="M 0,90 A 90,90 0 0,1 -63.64,63.64 L 0,0 Z" fill="#DC2626" stroke="white" stroke-width="1"/>
    <text x="-35" y="50" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">21</text>
    
    <path d="M -63.64,63.64 A 90,90 0 0,1 -90,0 L 0,0 Z" fill="#1F2937" stroke="white" stroke-width="1"/>
    <text x="-55" y="25" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">2</text>
    
    <path d="M -90,0 A 90,90 0 0,1 -63.64,-63.64 L 0,0 Z" fill="#DC2626" stroke="white" stroke-width="1"/>
    <text x="-55" y="-20" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">25</text>
    
    <path d="M -63.64,-63.64 A 90,90 0 0,1 0,-90 L 0,0 Z" fill="#10B981" stroke="white" stroke-width="1"/>
    <text x="-25" y="-45" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
  </g>
  
  <!-- Center hub -->
  <circle cx="200" cy="150" r="15" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Spinning ball -->
  <circle cx="230" cy="100" r="6" fill="white" filter="url(#ballGlow)"/>
  <circle cx="230" cy="100" r="4" fill="#E5E7EB"/>
  
  <!-- Ball trail -->
  <path d="M 230 100 Q 250 120 260 150 Q 250 180 230 200" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Betting layout preview -->
  <g transform="translate(50,50)">
    <rect x="0" y="0" width="80" height="20" fill="#DC2626" stroke="white" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">RED</text>
  </g>
  
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="80" height="20" fill="#1F2937" stroke="white" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">BLACK</text>
  </g>
  
  <g transform="translate(320,80)">
    <rect x="0" y="0" width="60" height="20" fill="#059669" stroke="white" stroke-width="1"/>
    <text x="30" y="14" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1st 12</text>
  </g>
  
  <g transform="translate(320,110)">
    <rect x="0" y="0" width="60" height="20" fill="#7C2D12" stroke="white" stroke-width="1"/>
    <text x="30" y="14" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">2nd 12</text>
  </g>
  
  <!-- Betting chips on table -->
  <g transform="translate(70,60)">
    <circle cx="0" cy="0" r="8" fill="#EF4444"/>
    <circle cx="0" cy="0" r="5" fill="#F87171"/>
    <text x="0" y="2" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="6" font-weight="bold">500</text>
  </g>
  
  <g transform="translate(340,95)">
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
    <circle cx="0" cy="0" r="4" fill="#34D399"/>
    <text x="0" y="1" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="5" font-weight="bold">100</text>
  </g>
  
  <!-- Winning number display -->
  <rect x="150" y="250" width="100" height="35" rx="17" fill="rgba(220,38,38,0.8)"/>
  <text x="200" y="272" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">RED 32</text>
  
  <!-- Payout display -->
  <rect x="280" y="200" width="80" height="25" rx="12" fill="rgba(16,185,129,0.2)"/>
  <text x="320" y="217" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">WIN 2:1</text>
  
  <!-- European style indicator -->
  <rect x="20" y="200" width="100" height="20" rx="10" fill="rgba(59,130,246,0.2)"/>
  <text x="70" y="213" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">EUROPEAN</text>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold">ROULETTE</text>
</svg>
