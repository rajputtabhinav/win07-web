<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dragonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tigerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- VS Circle -->
  <circle cx="200" cy="150" r="40" fill="rgba(0,0,0,0.8)" stroke="#FBBF24" stroke-width="3"/>
  <text x="200" y="160" text-anchor="middle" fill="#FBBF24" font-family="Arial, sans-serif" font-size="24" font-weight="bold">VS</text>
  
  <!-- Dragon Side -->
  <g transform="translate(50,80)">
    <!-- Dragon symbol -->
    <path d="M 30 30 Q 50 10 70 30 Q 60 50 50 40 Q 40 50 30 30" fill="url(#dragonGradient)" filter="url(#glow)"/>
    <circle cx="40" cy="25" r="3" fill="#FBBF24"/>
    <circle cx="60" cy="25" r="3" fill="#FBBF24"/>
    <path d="M 45 35 Q 50 40 55 35" fill="#FBBF24" stroke="none"/>
    
    <!-- Dragon card (King) -->
    <rect x="10" y="60" width="40" height="60" rx="8" fill="white" filter="url(#cardShadow)"/>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">K</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="20" fill="#DC2626">♥</text>
    
    <!-- Dragon betting area -->
    <rect x="0" y="140" width="100" height="40" rx="20" fill="rgba(239,68,68,0.3)" stroke="#EF4444" stroke-width="2"/>
    <text x="50" y="165" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DRAGON</text>
  </g>
  
  <!-- Tiger Side -->
  <g transform="translate(250,80)">
    <!-- Tiger symbol -->
    <ellipse cx="50" cy="30" rx="20" ry="15" fill="url(#tigerGradient)" filter="url(#glow)"/>
    <circle cx="45" cy="25" r="2" fill="black"/>
    <circle cx="55" cy="25" r="2" fill="black"/>
    <path d="M 50 30 L 50 35" stroke="black" stroke-width="2"/>
    <path d="M 45 35 Q 50 40 55 35" fill="none" stroke="black" stroke-width="2"/>
    <!-- Tiger stripes -->
    <path d="M 35 25 Q 40 30 35 35" fill="none" stroke="#B45309" stroke-width="2"/>
    <path d="M 65 25 Q 60 30 65 35" fill="none" stroke="#B45309" stroke-width="2"/>
    
    <!-- Tiger card (Queen) -->
    <rect x="50" y="60" width="40" height="60" rx="8" fill="white" filter="url(#cardShadow)"/>
    <text x="60" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="black">Q</text>
    <text x="60" y="105" font-family="Arial, sans-serif" font-size="20" fill="black">♠</text>
    
    <!-- Tiger betting area -->
    <rect x="0" y="140" width="100" height="40" rx="20" fill="rgba(245,158,11,0.3)" stroke="#F59E0B" stroke-width="2"/>
    <text x="50" y="165" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="18" font-weight="bold">TIGER</text>
  </g>
  
  <!-- Tie betting area -->
  <rect x="150" y="220" width="100" height="35" rx="17" fill="rgba(16,185,129,0.3)" stroke="#10B981" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">TIE 8:1</text>
  
  <!-- Winner announcement -->
  <rect x="250" y="30" width="120" height="30" rx="15" fill="rgba(239,68,68,0.8)"/>
  <text x="310" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">DRAGON WINS!</text>
  
  <!-- Betting chips -->
  <g transform="translate(80,200)">
    <circle cx="0" cy="0" r="12" fill="#EF4444"/>
    <circle cx="0" cy="0" r="8" fill="#F87171"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">250</text>
  </g>
  
  <g transform="translate(320,200)">
    <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="6" fill="#FBB040"/>
    <text x="0" y="2" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">100</text>
  </g>
  
  <!-- Fast game indicator -->
  <rect x="30" y="250" width="100" height="20" rx="10" fill="rgba(59,130,246,0.2)"/>
  <text x="80" y="263" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">FAST GAME</text>
  
  <!-- Payout info -->
  <rect x="270" y="250" width="100" height="20" rx="10" fill="rgba(16,185,129,0.2)"/>
  <text x="320" y="263" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1:1 PAYOUT</text>
  
  <!-- Lightning effects for fast gameplay -->
  <g stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 120 100 L 125 90 L 130 100 L 135 85"/>
    <path d="M 265 100 L 270 90 L 275 100 L 280 85"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">DRAGON TIGER</text>
</svg>
