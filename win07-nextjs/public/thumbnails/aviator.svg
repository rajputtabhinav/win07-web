<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky Background -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.3)">
    <ellipse cx="80" cy="60" rx="30" ry="15"/>
    <ellipse cx="100" cy="55" rx="25" ry="12"/>
    <ellipse cx="320" cy="80" rx="35" ry="18"/>
    <ellipse cx="340" cy="75" rx="28" ry="14"/>
  </g>
  
  <!-- Airplane -->
  <g transform="translate(200,150) rotate(-15)">
    <!-- Plane Body -->
    <ellipse cx="0" cy="0" rx="40" ry="8" fill="url(#planeGradient)" filter="url(#glow)"/>
    <!-- Wings -->
    <ellipse cx="-10" cy="0" rx="25" ry="3" fill="#FBBF24"/>
    <ellipse cx="10" cy="0" rx="15" ry="2" fill="#FBBF24"/>
    <!-- Tail -->
    <polygon points="-35,-5 -45,-2 -45,2 -35,5" fill="#F59E0B"/>
    <!-- Propeller -->
    <circle cx="35" cy="0" r="3" fill="#374151"/>
    <line x1="32" y1="0" x2="38" y2="0" stroke="#6B7280" stroke-width="1"/>
  </g>
  
  <!-- Multiplier Display -->
  <rect x="150" y="200" width="100" height="40" rx="20" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="225" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="24" font-weight="bold">2.45x</text>
  
  <!-- Graph Line -->
  <polyline points="50,250 100,240 150,220 200,180 250,160 300,140 350,120" 
            fill="none" stroke="#10B981" stroke-width="3" opacity="0.8"/>
  
  <!-- Sparkles -->
  <g fill="#FBBF24" opacity="0.8">
    <polygon points="100,100 102,106 108,106 103,110 105,116 100,112 95,116 97,110 92,106 98,106" transform="scale(0.8)"/>
    <polygon points="320,120 322,126 328,126 323,130 325,136 320,132 315,136 317,130 312,126 318,126" transform="scale(0.6)"/>
    <polygon points="150,80 152,86 158,86 153,90 155,96 150,92 145,96 147,90 142,86 148,86" transform="scale(0.5)"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.8)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">AVIATOR</text>
</svg>
