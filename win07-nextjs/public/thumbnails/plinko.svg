<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ballGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Plinko board frame -->
  <rect x="80" y="60" width="240" height="200" fill="none" stroke="#4B5563" stroke-width="3" rx="10"/>
  
  <!-- Pegs arranged in pyramid -->
  <g fill="#6B7280">
    <!-- Row 1 -->
    <circle cx="200" cy="80" r="4"/>
    
    <!-- Row 2 -->
    <circle cx="180" cy="100" r="4"/>
    <circle cx="220" cy="100" r="4"/>
    
    <!-- Row 3 -->
    <circle cx="160" cy="120" r="4"/>
    <circle cx="200" cy="120" r="4"/>
    <circle cx="240" cy="120" r="4"/>
    
    <!-- Row 4 -->
    <circle cx="140" cy="140" r="4"/>
    <circle cx="180" cy="140" r="4"/>
    <circle cx="220" cy="140" r="4"/>
    <circle cx="260" cy="140" r="4"/>
    
    <!-- Row 5 -->
    <circle cx="120" cy="160" r="4"/>
    <circle cx="160" cy="160" r="4"/>
    <circle cx="200" cy="160" r="4"/>
    <circle cx="240" cy="160" r="4"/>
    <circle cx="280" cy="160" r="4"/>
    
    <!-- Row 6 -->
    <circle cx="100" cy="180" r="4"/>
    <circle cx="140" cy="180" r="4"/>
    <circle cx="180" cy="180" r="4"/>
    <circle cx="220" cy="180" r="4"/>
    <circle cx="260" cy="180" r="4"/>
    <circle cx="300" cy="180" r="4"/>
    
    <!-- Row 7 -->
    <circle cx="120" cy="200" r="4"/>
    <circle cx="160" cy="200" r="4"/>
    <circle cx="200" cy="200" r="4"/>
    <circle cx="240" cy="200" r="4"/>
    <circle cx="280" cy="200" r="4"/>
  </g>
  
  <!-- Multiplier buckets at bottom -->
  <g>
    <rect x="85" y="220" width="30" height="35" fill="#DC2626" opacity="0.7"/>
    <text x="100" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0.5x</text>
    
    <rect x="120" y="220" width="30" height="35" fill="#F59E0B" opacity="0.7"/>
    <text x="135" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1.2x</text>
    
    <rect x="155" y="220" width="30" height="35" fill="#10B981" opacity="0.7"/>
    <text x="170" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3.0x</text>
    
    <rect x="190" y="220" width="30" height="35" fill="#3B82F6" opacity="0.7"/>
    <text x="205" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5.0x</text>
    
    <rect x="225" y="220" width="30" height="35" fill="#8B5CF6" opacity="0.7"/>
    <text x="240" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">10x</text>
    
    <rect x="260" y="220" width="30" height="35" fill="#10B981" opacity="0.7"/>
    <text x="275" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3.0x</text>
    
    <rect x="295" y="220" width="30" height="35" fill="#F59E0B" opacity="0.7"/>
    <text x="310" y="242" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1.2x</text>
  </g>
  
  <!-- Falling balls -->
  <circle cx="200" cy="90" r="6" fill="url(#ballGradient)" filter="url(#glow)"/>
  <circle cx="185" cy="110" r="6" fill="url(#ballGradient)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="165" cy="130" r="6" fill="url(#ballGradient)" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Ball trail -->
  <path d="M 200 70 L 200 90 L 185 110 L 165 130 L 155 150" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Sparkle effects -->
  <g fill="#FBBF24" opacity="0.8">
    <polygon points="240,100 242,106 248,106 243,110 245,116 240,112 235,116 237,110 232,106 238,106" transform="scale(0.6)"/>
    <polygon points="160,170 162,176 168,176 163,180 165,186 160,182 155,186 157,180 152,176 158,176" transform="scale(0.5)"/>
    <polygon points="320,120 322,126 328,126 323,130 325,136 320,132 315,136 317,130 312,126 318,126" transform="scale(0.4)"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">PLINKO</text>
</svg>
