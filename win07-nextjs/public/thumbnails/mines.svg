<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="gemGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="mineGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Grid of cells -->
  <g transform="translate(100,80)">
    <!-- Grid background -->
    <rect width="200" height="160" fill="rgba(55,65,81,0.5)" rx="10"/>
    
    <!-- 5x4 grid of cells -->
    <g>
      <!-- Row 1 -->
      <rect x="10" y="10" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="50" y="10" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="90" y="10" width="30" height="30" rx="5" fill="#059669" stroke="#10B981" stroke-width="2"/>
      <polygon points="105,15 110,20 115,15 110,30 105,25 100,30" fill="url(#gemGradient)" filter="url(#glow)"/>
      <rect x="130" y="10" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="170" y="10" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      
      <!-- Row 2 -->
      <rect x="10" y="50" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="50" y="50" width="30" height="30" rx="5" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
      <circle cx="65" cy="65" r="8" fill="url(#mineGradient)"/>
      <circle cx="65" cy="65" r="4" fill="#1F2937"/>
      <g stroke="#EF4444" stroke-width="1" opacity="0.8">
        <line x1="57" y1="65" x2="73" y2="65"/>
        <line x1="65" y1="57" x2="65" y2="73"/>
        <line x1="59" y1="59" x2="71" y2="71"/>
        <line x1="59" y1="71" x2="71" y2="59"/>
      </g>
      <rect x="90" y="50" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="130" y="50" width="30" height="30" rx="5" fill="#059669" stroke="#10B981" stroke-width="2"/>
      <polygon points="145,55 150,60 155,55 150,70 145,65 140,70" fill="url(#gemGradient)" filter="url(#glow)"/>
      <rect x="170" y="50" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      
      <!-- Row 3 -->
      <rect x="10" y="90" width="30" height="30" rx="5" fill="#059669" stroke="#10B981" stroke-width="2"/>
      <polygon points="25,95 30,100 35,95 30,110 25,105 20,110" fill="url(#gemGradient)" filter="url(#glow)"/>
      <rect x="50" y="90" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="90" y="90" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="130" y="90" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="170" y="90" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      
      <!-- Row 4 -->
      <rect x="10" y="130" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="50" y="130" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="90" y="130" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="130" y="130" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
      <rect x="170" y="130" width="30" height="30" rx="5" fill="#374151" stroke="#4B5563" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Multiplier Display -->
  <rect x="140" y="250" width="120" height="35" rx="17" fill="rgba(0,0,0,0.8)"/>
  <text x="200" y="272" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="22" font-weight="bold">2.50x</text>
  
  <!-- Gems found counter -->
  <g transform="translate(320,100)">
    <rect x="0" y="0" width="70" height="30" rx="15" fill="rgba(16,185,129,0.2)"/>
    <polygon points="15,8 20,13 25,8 20,23 15,18 10,23" fill="url(#gemGradient)" transform="scale(0.6)"/>
    <text x="40" y="20" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">x3</text>
  </g>
  
  <!-- Mines counter -->
  <g transform="translate(320,140)">
    <rect x="0" y="0" width="70" height="30" rx="15" fill="rgba(239,68,68,0.2)"/>
    <circle cx="20" cy="15" r="6" fill="url(#mineGradient)" transform="scale(0.8)"/>
    <text x="40" y="20" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="16" font-weight="bold">x5</text>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">MINES</text>
</svg>
