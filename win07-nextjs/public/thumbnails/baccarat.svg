<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C2D12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B1A05;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Elegant table -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="url(#tableGradient)"/>
  <ellipse cx="200" cy="150" rx="160" ry="100" fill="none" stroke="#92400e" stroke-width="3"/>
  
  <!-- Baccarat logo in center -->
  <ellipse cx="200" cy="150" rx="60" ry="30" fill="rgba(217,119,6,0.2)" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" fill="#d97706" font-family="serif" font-size="16" font-weight="bold" font-style="italic">BACCARAT</text>
  
  <!-- Player section -->
  <g transform="translate(80,200)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PLAYER</text>
  </g>
  
  <!-- Banker section -->
  <g transform="translate(240,200)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="rgba(220,38,38,0.3)" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BANKER</text>
  </g>
  
  <!-- Tie section -->
  <g transform="translate(160,240)">
    <rect x="0" y="0" width="80" height="25" rx="12" fill="rgba(16,185,129,0.3)" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="17" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TIE 8:1</text>
  </g>
  
  <!-- Player cards -->
  <g transform="translate(60,120)">
    <!-- 9 of Hearts -->
    <rect x="0" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">9</text>
    <text x="8" y="35" font-family="Arial, sans-serif" font-size="16" fill="#DC2626">♥</text>
    
    <!-- Ace of Spades -->
    <rect x="40" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="48" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">A</text>
    <text x="48" y="35" font-family="Arial, sans-serif" font-size="16" fill="black">♠</text>
  </g>
  
  <!-- Player total -->
  <rect x="80" y="170" width="40" height="25" rx="12" fill="rgba(59,130,246,0.8)"/>
  <text x="100" y="187" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">0</text>
  
  <!-- Banker cards -->
  <g transform="translate(310,120)">
    <!-- 7 of Diamonds -->
    <rect x="0" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">7</text>
    <text x="8" y="35" font-family="Arial, sans-serif" font-size="16" fill="#DC2626">♦</text>
    
    <!-- 2 of Clubs -->
    <rect x="40" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="48" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">2</text>
    <text x="48" y="35" font-family="Arial, sans-serif" font-size="16" fill="black">♣</text>
  </g>
  
  <!-- Banker total -->
  <rect x="280" y="170" width="40" height="25" rx="12" fill="rgba(220,38,38,0.8)"/>
  <text x="300" y="187" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">9</text>
  
  <!-- High roller chips -->
  <g transform="translate(40,80)">
    <circle cx="0" cy="0" r="15" fill="#FFD700" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#FFA500"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">5K</text>
  </g>
  
  <g transform="translate(360,90)">
    <circle cx="0" cy="0" r="12" fill="#8B5CF6"/>
    <circle cx="0" cy="0" r="8" fill="#A78BFA"/>
    <text x="0" y="2" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">1K</text>
  </g>
  
  <!-- Winner announcement -->
  <rect x="240" y="60" width="120" height="35" rx="17" fill="rgba(220,38,38,0.8)"/>
  <text x="300" y="82" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">BANKER WINS!</text>
  
  <!-- Payout info -->
  <rect x="40" y="250" width="100" height="20" rx="10" fill="rgba(217,119,6,0.2)"/>
  <text x="90" y="263" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Banker: 0.95:1</text>
  
  <rect x="260" y="250" width="100" height="20" rx="10" fill="rgba(217,119,6,0.2)"/>
  <text x="310" y="263" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Player: 1:1</text>
  
  <!-- Elegant decorative elements -->
  <g stroke="#d97706" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 50 50 Q 70 40 90 50"/>
    <path d="M 310 50 Q 330 40 350 50"/>
    <path d="M 50 250 Q 70 260 90 250"/>
    <path d="M 310 250 Q 330 260 350 250"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="serif" font-size="26" font-weight="bold">BACCARAT</text>
</svg>
