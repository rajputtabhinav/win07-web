<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Table -->
  <ellipse cx="200" cy="150" rx="180" ry="120" fill="url(#tableGradient)"/>
  <ellipse cx="200" cy="150" rx="160" ry="100" fill="none" stroke="#065f46" stroke-width="3"/>
  
  <!-- Blackjack text on table -->
  <path d="M 120 150 Q 200 130 280 150" fill="none" stroke="#065f46" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" opacity="0.7">
    BLACKJACK PAYS 3 TO 2
  </text>
  
  <!-- Dealer Cards (face down + Ace) -->
  <g transform="translate(160,70)">
    <!-- Hidden card -->
    <rect x="0" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <rect x="2" y="2" width="26" height="41" rx="3" fill="#1E40AF"/>
    <g fill="#FBBF24" transform="translate(15,22)">
      <polygon points="-8,-8 -2,-5 4,-8 1,-2 7,1 1,4 4,10 -2,7 -8,10 -5,4 -11,1 -5,-2"/>
    </g>
    
    <!-- Ace of Spades -->
    <rect x="40" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">A</text>
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" fill="black">♠</text>
  </g>
  
  <!-- Dealer total -->
  <rect x="170" y="120" width="60" height="25" rx="12" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="137" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DEALER</text>
  
  <!-- Player Cards (King + Jack = 20) -->
  <g transform="translate(160,200)">
    <!-- King of Hearts -->
    <rect x="0" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">K</text>
    <text x="8" y="35" font-family="Arial, sans-serif" font-size="16" fill="#DC2626">♥</text>
    
    <!-- Jack of Clubs -->
    <rect x="40" y="0" width="30" height="45" rx="5" fill="white" filter="url(#cardShadow)"/>
    <text x="48" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">J</text>
    <text x="48" y="35" font-family="Arial, sans-serif" font-size="16" fill="black">♣</text>
  </g>
  
  <!-- Player total -->
  <rect x="170" y="250" width="60" height="25" rx="12" fill="rgba(16,185,129,0.8)"/>
  <text x="200" y="267" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">20</text>
  
  <!-- Action buttons -->
  <g transform="translate(280,180)">
    <rect x="0" y="0" width="50" height="25" rx="12" fill="rgba(16,185,129,0.2)"/>
    <text x="25" y="17" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">STAND</text>
  </g>
  
  <g transform="translate(280,210)">
    <rect x="0" y="0" width="50" height="25" rx="12" fill="rgba(239,68,68,0.2)"/>
    <text x="25" y="17" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="12" font-weight="bold">HIT</text>
  </g>
  
  <g transform="translate(280,240)">
    <rect x="0" y="0" width="50" height="25" rx="12" fill="rgba(245,158,11,0.2)"/>
    <text x="25" y="17" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="10" font-weight="bold">DOUBLE</text>
  </g>
  
  <!-- Betting chips -->
  <g transform="translate(80,180)">
    <circle cx="0" cy="0" r="12" fill="#EF4444"/>
    <circle cx="0" cy="0" r="8" fill="#F87171"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">100</text>
  </g>
  
  <g transform="translate(320,120)">
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <circle cx="0" cy="0" r="6" fill="#34D399"/>
    <text x="0" y="2" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold">25</text>
  </g>
  
  <!-- Win indicator -->
  <rect x="50" y="100" width="80" height="30" rx="15" fill="rgba(16,185,129,0.3)"/>
  <text x="90" y="120" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BLACKJACK!</text>
  
  <!-- RTP indicator -->
  <rect x="300" y="60" width="80" height="20" rx="10" fill="rgba(59,130,246,0.2)"/>
  <text x="340" y="73" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">RTP: 99.5%</text>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="50" fill="rgba(0,0,0,0.9)"/>
  <text x="200" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold">BLACKJACK</text>
</svg>
